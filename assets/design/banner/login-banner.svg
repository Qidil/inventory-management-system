<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" fill="none">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC008C;stop-opacity:0.1" />
      <stop offset="50%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00B2D8;stop-opacity:0.1" />
    </linearGradient>
    <linearGradient id="magentaGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#EC008C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#C7007A;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="400" height="500" fill="url(#bgGradient)"/>
  
  <!-- Decorative circles -->
  <circle cx="50" cy="50" r="80" fill="#EC008C" opacity="0.05"/>
  <circle cx="350" cy="450" r="100" fill="#00B2D8" opacity="0.05"/>
  
  <!-- Main inventory icon -->
  <g transform="translate(125, 120)">
    <!-- Box shadow -->
    <rect x="12" y="52" width="140" height="20" rx="10" fill="#1F2937" opacity="0.1"/>
    
    <!-- Main box -->
    <rect x="20" y="20" width="140" height="120" rx="12" fill="url(#magentaGradient)"/>
    
    <!-- Box lid -->
    <rect x="10" y="10" width="160" height="30" rx="6" fill="#C7007A"/>
    
    <!-- Box details -->
    <rect x="35" y="50" width="110" height="8" rx="2" fill="white" opacity="0.9"/>
    <rect x="35" y="65" width="110" height="8" rx="2" fill="white" opacity="0.9"/>
    <rect x="35" y="80" width="110" height="8" rx="2" fill="white" opacity="0.9"/>
    
    <!-- Accent dot -->
    <circle cx="90" cy="110" r="8" fill="#00B2D8"/>
  </g>
  
  <!-- Floating items -->
  <g transform="translate(60, 280)">
    <rect width="60" height="40" rx="6" fill="#00B2D8" opacity="0.8"/>
    <rect x="8" y="8" width="44" height="4" rx="1" fill="white"/>
    <rect x="8" y="16" width="44" height="4" rx="1" fill="white"/>
    <rect x="8" y="24" width="44" height="4" rx="1" fill="white"/>
  </g>
  
  <g transform="translate(280, 280)">
    <rect width="60" height="40" rx="6" fill="#EC008C" opacity="0.8"/>
    <rect x="8" y="8" width="44" height="4" rx="1" fill="white"/>
    <rect x="8" y="16" width="44" height="4" rx="1" fill="white"/>
    <rect x="8" y="24" width="44" height="4" rx="1" fill="white"/>
  </g>
  
  <g transform="translate(160, 340)">
    <rect width="60" height="40" rx="6" fill="#1F2937" opacity="0.6"/>
    <rect x="8" y="8" width="44" height="4" rx="1" fill="white"/>
    <rect x="8" y="16" width="44" height="4" rx="1" fill="white"/>
    <rect x="8" y="24" width="44" height="4" rx="1" fill="white"/>
  </g>
  
  <!-- Decorative dots -->
  <circle cx="80" cy="400" r="4" fill="#EC008C" opacity="0.5"/>
  <circle cx="120" cy="420" r="3" fill="#00B2D8" opacity="0.5"/>
  <circle cx="320" cy="400" r="4" fill="#EC008C" opacity="0.5"/>
  <circle cx="280" cy="420" r="3" fill="#00B2D8" opacity="0.5"/>
  
  <!-- Bottom accent line -->
  <rect x="100" y="460" width="200" height="4" rx="2" fill="#EC008C" opacity="0.3"/>
</svg>